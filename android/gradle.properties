org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# MLKit barcode model: BUNDLED into the APK, not downloaded.
#
# mobile_scanner defaults this to false already; it is written out explicitly because
# the usual advice is to flip it. Setting it true swaps the bundled model for
# play-services-mlkit-barcode-scanning, which saves several MB of APK by fetching the
# model from Google Play Services on first use.
#
# That trade is wrong for this app. nestwatch's promise is that nothing leaves the
# house, and a scanner that phones Google the first time a parent pairs a device breaks
# that on the parent's phone. It would also make pairing fail on a phone with no
# internet — which is a normal state for a device that only ever talks to a PC on the
# LAN, and is exactly when someone is most likely to be setting this up.
dev.steenbakker.mobile_scanner.useUnbundled=false
